<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Catalogo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 10% 10%, #d8eeff 0%, #eef6ff 42%, #e7f9ec 100%);
            color: #1f2d3d;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 26px;
            background: #2a89c6;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .navbar .brand {
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .navbar .link {
            color: #e9f6ff;
            text-decoration: none;
            font-weight: 600;
        }

        .login-wrapper {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 410px;
            background-color: #ffffff;
            border-radius: 14px;
            box-shadow: 0 16px 36px rgba(24, 39, 75, 0.15);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(120deg, #3498db 0%, #54b3eb 100%);
            color: #ffffff;
            padding: 22px;
            text-align: center;
        }

        .card-header h1 {
            font-size: 1.25rem;
            letter-spacing: 0.4px;
        }

        .card-header p {
            margin-top: 6px;
            font-size: 0.88rem;
            opacity: 0.92;
        }

        .card-body {
            padding: 24px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d4dbe3;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.16);
        }

        button {
            width: 100%;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            color: #ffffff;
            background-color: #27ae60;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #219a52;
        }

        .alert {
            margin-bottom: 14px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.88rem;
        }

        .alert-error {
            background-color: #fdecea;
            color: #9f3a38;
            border: 1px solid #f2c7c4;
        }

        .alert-success {
            background-color: #eaf8ef;
            color: #2a7b43;
            border: 1px solid #c5e9d1;
        }

        .footer-link {
            margin-top: 14px;
            text-align: center;
        }

        .footer-link a {
            color: #3498db;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        .field-error {
            color: #b33939;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .input-error {
            border-color: #b33939 !important;
        }

        @media (max-width: 580px) {
            .navbar {
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }

            .login-wrapper {
                min-height: calc(100vh - 92px);
            }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="/produtos" class="brand">FATEC - CATALOGO</a>
    <a href="/produtos" class="link">Ver catalogo</a>
</nav>

<div class="login-wrapper">
    <div class="card">
        <div class="card-header">
            <h1>Acesso ao Catalogo</h1>
            <p>Entre com sua conta para continuar</p>
        </div>
        <div class="card-body">
            <div th:if="${param.error}" class="alert alert-error">
                Usuario ou senha invalidos.
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                Voce saiu da sessao com sucesso.
            </div>

            <form th:action="@{/login}" method="post" novalidate data-validate="true">
                <div class="field">
                    <label for="username">Usuario</label>
                    <input id="username" type="text" name="username" required autofocus>
                </div>

                <div class="field">
                    <label for="password">Senha</label>
                    <input id="password" type="password" name="password" required>
                </div>

                <button type="submit">Entrar</button>
            </form>

            <div class="footer-link">
                <a href="/produtos">Voltar para catalogo</a>
            </div>
        </div>
    </div>
</div>
<script>
    (function () {
        const form = document.querySelector('form[data-validate="true"]');
        if (!form) return;

        const fields = form.querySelectorAll('input');

        function removeError(field) {
            const existing = field.parentElement.querySelector('.field-error.client-error');
            if (existing) existing.remove();
            field.classList.remove('input-error');
        }

        function showError(field, message) {
            removeError(field);
            const error = document.createElement('div');
            error.className = 'field-error client-error';
            error.textContent = message;
            field.parentElement.appendChild(error);
            field.classList.add('input-error');
        }

        function validateField(field) {
            removeError(field);
            const value = (field.value || '').trim();

            if (field.hasAttribute('required') && !value) {
                showError(field, 'Campo obrigatorio.');
                return false;
            }

            return true;
        }

        form.addEventListener('submit', function (event) {
            let isValid = true;
            fields.forEach(function (field) {
                if (!validateField(field)) isValid = false;
            });

            if (!isValid) {
                event.preventDefault();
            }
        });

        fields.forEach(function (field) {
            field.addEventListener('input', function () {
                validateField(field);
            });
        });
    })();
</script>
</body>
</html>
