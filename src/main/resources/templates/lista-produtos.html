<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --surface-2: #f8fbff;
            --text: #1f2a37;
            --muted: #637083;
            --primary: #3f6f96;
            --primary-soft: #5e89ac;
            --border: #dbe3ec;
            --danger: #c95454;
            --success: #2f8a5f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            background-color: var(--surface);
            padding: 14px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.98rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        nav a:hover {
            color: var(--primary-soft);
        }

        .nav-left,
        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-user {
            color: var(--muted);
            font-size: 0.88rem;
            font-weight: 600;
        }

        .btn-logout {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s ease;
        }

        .btn-logout:hover {
            background: var(--primary-soft);
        }

        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #f7f9fc 0%, #f3f6fa 100%);
            color: var(--text);
        }

        h1 {
            text-align: center;
            margin: 26px 0 22px;
            font-size: 1.65rem;
            color: #2a3a4b;
            letter-spacing: 0.3px;
        }

        table {
            width: 100%;
            max-width: 940px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 22px rgba(41, 61, 90, 0.08);
            border: 1px solid var(--border);
            margin: 0 auto 24px;
        }

        thead {
            background-color: var(--surface-2);
            color: #33485f;
        }

        thead th {
            padding: 14px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 0.88rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid var(--border);
        }

        tbody tr {
            border-bottom: 1px solid #edf2f7;
            transition: background-color 0.2s ease;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f7fbff;
        }

        tbody td {
            padding: 13px 20px;
            font-size: 0.95rem;
        }

        tbody td:nth-child(2) {
            color: var(--success);
            font-weight: 600;
        }

        .textColor {
            color: var(--danger) !important;
        }

        .btn-editar,
        .btn-remover {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-editar {
            background-color: var(--primary-soft);
            color: #fff;
            margin-right: 6px;
        }

        .btn-editar:hover {
            background-color: var(--primary);
        }

        .btn-remover {
            background-color: #d46b6b;
            color: #fff;
        }

        .btn-remover:hover {
            background-color: var(--danger);
        }

        .acoes-form {
            display: inline;
        }

        input,
        select {
            padding: 0.48rem 0.58rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text);
            background: var(--surface);
        }

        .filtros {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-filtrar {
            background: var(--primary-soft);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-filtrar:hover {
            background: var(--primary);
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .nav-right {
                width: 100%;
                justify-content: space-between;
            }

            table {
                max-width: 100%;
            }

            .filtros {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
<nav>
    <div class="nav-left">
        <a href="/produtos">FATEC - CATALOGO</a>
        <a href="/dashboard" sec:authorize="hasRole('ADMIN')" style="margin-left: 18px;">Dashboard</a>
    </div>
    <div class="nav-right">
        <span class="nav-user">Usuario: <strong sec:authentication="name"></strong></span>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn-logout" type="submit">Sair</button>
        </form>
    </div>
</nav>
<h1>Lista de Produtos</h1>
<table>
    <thead>
    <tr>
        <th>Nome</th>
        <th>Categoria</th>
        <th>Valor</th>
        <th>Data de Cadastro</th>
        <th>Ações</th>
        <th>
            <form method="get" action="/produtos" class="filtros">
                <input type="text" name="busca" placeholder="pesquise" th:value="${busca}">
                <select name="categoriaId">
                    <option value="">Todas categorias</option>
                    <option th:each="c : ${categorias}"
                            th:value="${c.idCategoria}"
                            th:text="${c.nome}"
                            th:selected="${categoriaId != null and categoriaId == c.idCategoria}"></option>
                </select>
                <button type="submit" class="btn-filtrar">Filtrar</button>
            </form>
        </th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${produtos}">
        <td th:text="${p.nome}"></td>
        <td th:text="${p.categoria.nome}"></td>
        <td th:text="${p.valor}" th:classappend="${p.valor > 1000 ? 'textColor' : null}"></td>
        <td th:text="${#temporals.format(p.dataCadastro, 'dd/MM/yyyy HH:mm:ss')}"></td>
        <td>
            <a class="btn-editar" th:href="@{/produtos/editar/{id}(id=${p.idProduto})}" sec:authorize="hasRole('ADMIN')">Editar</a>

            <a class="btn-remover" th:href="@{/produtos/excluir/{id}(id=${p.idProduto})}"
            onclick="return confirm('Quer mesmo exlcuir?')" sec:authorize="hasRole('ADMIN')"
            >Remover</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
