<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
    <style>
        :root {
            --bg: #f5f8fc;
            --surface: #ffffff;
            --text: #223042;
            --muted: #66788d;
            --primary: #3f6f96;
            --primary-soft: #5f89ab;
            --border: #dbe4ed;
            --danger: #c95454;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #f8fafd 0%, #f3f6fb 100%);
            color: var(--text);
        }

        .container {
            display: flex;
            justify-content: center;
            padding: 50px 20px;
        }

        .card {
            background-color: var(--surface);
            border-radius: 12px;
            box-shadow: 0 10px 28px rgba(46, 66, 95, 0.09);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }

        .card-header {
            background: #f7fafe;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
        }

        .card-header h2 {
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .card-body {
            padding: 28px 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #334a60;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: var(--primary-soft);
            box-shadow: 0 0 0 3px rgba(95, 137, 171, 0.16);
        }

        .form-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 28px;
        }

        button[type="submit"] {
            background-color: var(--primary-soft);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button[type="submit"]:hover {
            background-color: var(--primary);
        }

        .form-actions a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .form-actions a:hover {
            color: #44586b;
        }

        .field-error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .input-error {
            border-color: var(--danger) !important;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>Editar Produto</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/produtos/salvar}" method="post" th:object="${produto}" novalidate data-validate="true">
                <input type="hidden" th:field="*{idProduto}" />

                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" th:field="*{nome}" required>
                    <div class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>

                <div class="form-group">
                    <label>Valor</label>
                    <input type="number" step="0.01" th:field="*{valor}" required>
                    <div class="field-error" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" th:field="*{categoria.idCategoria}" required>
                        <option value="">Selecione uma categoria</option>
                        <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nome}"></option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
                    <div class="field-error" th:if="${#fields.hasErrors('categoria.idCategoria')}" th:errors="*{categoria.idCategoria}"></div>
                </div>

                <div class="field-error" th:if="${erro}" style="margin-bottom: 10px;">
                    <span th:text="${erro}"></span>
                </div>

                <div class="form-actions">
                    <button type="submit">Atualizar</button>
                    <a href="/produtos">Voltar</a>
                </div>

            </form>

        </div>
    </div>
</div>
<script>
    (function () {
        const form = document.querySelector('form[data-validate="true"]');
        if (!form) return;

        const fields = form.querySelectorAll('input, select, textarea');

        function removeError(field) {
            const existing = field.parentElement.querySelector('.field-error.client-error');
            if (existing) existing.remove();
            field.classList.remove('input-error');
        }

        function showError(field, message) {
            removeError(field);
            const error = document.createElement('div');
            error.className = 'field-error client-error';
            error.textContent = message;
            field.parentElement.appendChild(error);
            field.classList.add('input-error');
        }

        function validateField(field) {
            removeError(field);

            if (field.disabled || field.type === 'hidden') return true;

            const value = (field.value || '').trim();

            if (field.hasAttribute('required') && !value) {
                showError(field, 'Campo obrigatorio.');
                return false;
            }

            return true;
        }

        form.addEventListener('submit', function (event) {
            let isValid = true;
            fields.forEach(function (field) {
                if (!validateField(field)) isValid = false;
            });

            if (!isValid) {
                event.preventDefault();
            }
        });

        fields.forEach(function (field) {
            field.addEventListener('input', function () {
                validateField(field);
            });
            field.addEventListener('change', function () {
                validateField(field);
            });
        });
    })();
</script>
</body>
</html>
