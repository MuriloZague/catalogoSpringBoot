<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuario - Catalogo</title>
    <style>
        :root {
            --bg: #f5f8fc;
            --surface: #ffffff;
            --text: #223042;
            --muted: #66788d;
            --primary: #3f6f96;
            --primary-soft: #5f89ab;
            --border: #dbe4ed;
            --success: #338c61;
            --danger: #c95454;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #f8fafd 0%, #f3f6fb 100%);
            color: var(--text);
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background-color: var(--surface);
            border-radius: 12px;
            box-shadow: 0 10px 28px rgba(46, 66, 95, 0.1);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .card-header {
            background: #f7fafe;
            color: var(--primary);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .card-header h1 {
            font-size: 1.2rem;
            letter-spacing: 0.3px;
        }

        .card-body {
            padding: 22px;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: var(--surface);
        }

        input:focus,
        select:focus {
            border-color: var(--primary-soft);
            box-shadow: 0 0 0 3px rgba(95, 137, 171, 0.16);
        }

        button {
            width: 100%;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            color: #ffffff;
            background-color: var(--primary-soft);
            transition: background-color 0.2s;
            margin-top: 4px;
        }

        button:hover {
            background-color: var(--primary);
        }

        .alert {
            margin-bottom: 14px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.88rem;
        }

        .alert-error {
            background-color: #fdf3f3;
            color: var(--danger);
            border: 1px solid #f1d4d4;
        }

        .alert-success {
            background-color: #eef8f2;
            color: var(--success);
            border: 1px solid #cfe6d8;
        }

        .footer-link {
            margin-top: 12px;
            text-align: center;
        }

        .footer-link a {
            color: var(--primary-soft);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        .field-error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .input-error {
            border-color: var(--danger) !important;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="card-header">
        <h1>Cadastrar novo usuario</h1>
    </div>

    <div class="card-body">
        <div th:if="${param.sucesso}" class="alert alert-success">
            Usuario cadastrado com sucesso.
        </div>

        <div th:if="${param.erro}" class="alert alert-error">
            Nao foi possivel cadastrar o usuario.
        </div>

        <form th:action="@{/usuarios/salvar}" method="post" novalidate data-validate="true">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="field">
                <label for="nomeCompleto">Nome completo</label>
                <input id="nomeCompleto" type="text" name="nomeCompleto" required>
            </div>

            <div class="field">
                <label for="username">Usuario</label>
                <input id="username" type="text" name="username" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" required>
            </div>

            <div class="field">
                <label for="senha">Senha</label>
                <input id="senha" type="password" name="senha" minlength="4" required>
            </div>

            <div class="field">
                <label for="confirmarSenha">Confirmar senha</label>
                <input id="confirmarSenha" type="password" name="confirmarSenha" minlength="4" required>
            </div>

            <div class="field">
                <label for="perfil">Perfil</label>
                <select id="perfil" name="perfil">
                    <option value="USER">Usuario</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>

            <button type="submit">Cadastrar usuario</button>
        </form>

        <div class="footer-link">
            <a href="/login">Voltar para login</a>
        </div>

        <div class="footer-link">
            <a href="/produtos">Ir para catalogo</a>
        </div>
    </div>
</div>
<script>
    (function () {
        const form = document.querySelector('form[data-validate="true"]');
        if (!form) return;

        const fields = form.querySelectorAll('input, select, textarea');

        function removeError(field) {
            const existing = field.parentElement.querySelector('.field-error.client-error');
            if (existing) existing.remove();
            field.classList.remove('input-error');
        }

        function showError(field, message) {
            removeError(field);
            const error = document.createElement('div');
            error.className = 'field-error client-error';
            error.textContent = message;
            field.parentElement.appendChild(error);
            field.classList.add('input-error');
        }

        function validateField(field) {
            removeError(field);

            if (field.disabled || field.type === 'hidden') return true;

            const value = (field.value || '').trim();
            const minLength = field.getAttribute('minlength');

            if (field.hasAttribute('required') && !value) {
                showError(field, 'Campo obrigatorio.');
                return false;
            }

            if (minLength && value && value.length < Number(minLength)) {
                showError(field, 'Minimo de ' + minLength + ' caracteres.');
                return false;
            }

            if (field.type === 'email' && value) {
                const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
                if (!emailValido) {
                    showError(field, 'Email invalido.');
                    return false;
                }
            }

            return true;
        }

        form.addEventListener('submit', function (event) {
            let isValid = true;

            fields.forEach(function (field) {
                if (!validateField(field)) isValid = false;
            });

            const senha = form.querySelector('input[name="senha"]');
            const confirmarSenha = form.querySelector('input[name="confirmarSenha"]');
            if (senha && confirmarSenha && senha.value !== confirmarSenha.value) {
                showError(confirmarSenha, 'As senhas devem ser iguais.');
                isValid = false;
            }

            if (!isValid) {
                event.preventDefault();
            }
        });

        fields.forEach(function (field) {
            field.addEventListener('input', function () {
                validateField(field);
            });
            field.addEventListener('change', function () {
                validateField(field);
            });
        });
    })();
</script>
</body>
</html>
